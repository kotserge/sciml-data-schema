[project]
name = "sciml-data-schema"
version = "0.1.0"
description = "An HDF5 dataset format and metadata schema for PDE / physics simulation data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Serge Kotchourko", email = "serge.kotchourko@gmail.com" }]
keywords = ["hdf5", "pde", "scientific-machine-learning", "dataset", "schema", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "h5py>=3.10",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "basedpyright>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sciml_data_schema"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lint rule families: pycodestyle (E, W), pyflakes (F), isort (I), pyupgrade (UP), bugbear (B),
# pydocstyle (D), flake8-annotations (ANN).
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "D", "ANN"]
# D105/D107: magic methods and __init__ are documented by their class; D401: a summary states
# what the unit computes, as a noun phrase or an imperative; ANN401: Any at the h5py boundary
ignore = ["D105", "D107", "D401", "ANN401"]

[tool.ruff.lint.pydocstyle]
# numpydoc sections: Parameters, Returns, Raises, Notes, Examples (CLAUDE.md, Docstrings)
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# A test's name states what it checks; module docstrings stay required
"tests/*" = ["D103"]

[tool.ruff.lint.isort]
known-first-party = ["sciml_data_schema"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.basedpyright]
# Resolve third-party imports (h5py, numpy) against the project's own venv.
venvPath = "."
venv = ".venv"
# "standard" is a real type check; it drops the strict-only rules that only fire
# because h5py ships no type stubs (reportUnknownMemberType, reportImportCycles, ...).
typeCheckingMode = "standard"
include = ["src", "tests", "examples"]
reportMissingTypeStubs = false
