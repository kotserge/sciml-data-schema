[project]
name = "sciml-data-schema"
version = "0.1.0"
description = "An HDF5 dataset format and metadata schema for PDE / physics simulation data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Serge Kotchourko", email = "serge.kotchourko@gmail.com" }]
keywords = ["hdf5", "pde", "scientific-machine-learning", "dataset", "schema", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "h5py>=3.10",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "basedpyright>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sciml_data_schema"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "W",   # pycodestyle warnings
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
# Resolve third-party imports (h5py, numpy) against the project's own venv.
venvPath = "."
venv = ".venv"
# "standard" is a real type check; it drops the strict-only rules that only fire
# because h5py ships no type stubs (reportUnknownMemberType, reportImportCycles, ...).
typeCheckingMode = "standard"
reportMissingTypeStubs = false
